    <header>

        </nav>

    </header>


    <main>

        <section>

            <h2>إنشاء حساب</h2>
            <p>
                أنشئ حسابك في CyberTitan.
            </p>


            <form id = "registerForm" action = "register.php" method = "POST">

                <div>

                    <label for="username">
                        اسم المستخدم
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="أدخل اسم المستخدم"
                        required>

                </div>


                <div>

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="أدخل بريدك الإلكتروني"
                        required>

                </div>


                <div>

                    <label for="password">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="أدخل كلمة المرور"
                        required>

                        <button type = "button" id = "showPassword">إظهار كلمة المرور</button>

                </div>


                <div>

                    <label for="confirm-password">
                        تأكيد كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        placeholder="أكّد كلمة المرور"
                        required>

                          <button type = "button" id = "showConfirmPassword">إظهار كلمة المرور</button>

                </div>


                <button type="submit">
                    إنشاء حساب
                </button>

                <p id = "formMessage"></p>

            </form>


            <p>
                هل لديك حساب بالفعل؟
                <a href="login.html">تسجيل الدخول</a>
            </p>

        </section>

    </main>


    <footer>

        <p>
            © 2026 CyberTitan.
        </p>

    </footer>


    <script src="main.js"></script>
