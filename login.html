        <section>

            <h2>تسجيل الدخول</h2>

            <p>
                سجّل الدخول إلى حسابك في CyberTitan.
            </p>


            <form action="login.php" method="POST">

                <div>

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="أدخل بريدك الإلكتروني"
                        required>

                </div>


                <div>

                    <label for="password">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="أدخل كلمة المرور"
                        required>

                    <button type="button" id="showPassword">إظهار كلمة المرور</button>

                </div>


                <button type="submit">
                    تسجيل الدخول
                </button>

            </form>


            <p>
                ليس لديك حساب؟
                <a href="register.html">أنشئ حسابًا</a>
            </p>

        </section>
